# pnpm 11 reads settings from here, not from a "pnpm" field in package.json.
#
# Postinstall scripts are blocked by default as a supply-chain defense. These
# three are required, and all are well-known native-binary packages:
#   esbuild        - downloads its platform binary
#   sharp          - native image pipeline used by next/image optimization
#   unrs-resolver  - native resolver used by eslint-config-next
#
# core-js is denied rather than left undecided: it arrives transitively via
# posthog-js, and its postinstall only prints a funding notice. Nothing is
# built, so running it buys nothing and widens the install surface.
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
